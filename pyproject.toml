[project]
name = "SynPlanner"
version = "1.8.0"
description = "Toolbox for chemical synthesis planning"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Laboratoire de Chemoinformatique", email = "tagirshin@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
  "chython-synplan[racer-default]==1.108",
  "numpy>=2",
  "pandas>=1.4",
  "onnxruntime>=1.23,<1.24; python_version < '3.11'", # 1.24 has no Python 3.10 wheels.
  "onnxruntime>=1.23; python_version >= '3.11'",
  "tqdm>=4.66",
  "click>=8.0.0",
  "huggingface-hub>=0.24.0",
  "rdkit>=2023.9.1",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "frozendict>=2.4.6",
  "ijson>=3.4.0",
  "protobuf>=6.0",
]

# Optional workflows; the base installation runs ONNX policies on CPU.
[project.optional-dependencies]
curation = [
  "torch>=2.0",
  "chytorch-synplan>=1.70",
  "chytorch-rxnmap-synplan>=1.7",
  "scipy>=1.10",
]
training = [
  "torch>=2.6",
  "torch-geometric>=2.4.0",
  "adabelief-pytorch>=0.2.1",
  "pytorch-lightning>=2.3.3,!=2.6.2,!=2.6.3",
  "torchmetrics>=1.0",
  "safetensors>=0.4",
  "jupyterlab>=4.5.7",
  "ipywidgets>8.1.0",
  "matplotlib>=3.7",
  "matplotlib-venn>=1.1",
  "onnx>=1.17",
  "onnxscript>=0.5",
]
gui = ["streamlit>1.35.1", "streamlit-ketcher>=0.0.1"]
all = ["SynPlanner[curation,training,gui]"]
cpu = ["torch>=2.0", "torch-geometric>=2.4.0"]
cu126 = ["torch>=2.0", "torch-geometric>=2.4.0"]
cu128 = ["torch>=2.0", "torch-geometric>=2.4.0"]

[dependency-groups]
dev = [
  "SynPlanner[curation,training]",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.6",
  "twine>=6.2.0,<7",
  "ruff>=0.14.4,<0.15",
  "grpcio-tools>=1.78.0",
]
docs = [
  "pydata-sphinx-theme>=0.15.4,<0.16",
  "pandoc>=2.3,<3",
  "ipython>=8.12.1,<9",
  "nbsphinx>=0.9.4,<0.10",
  "pypandoc-binary>=1.15,<2",
  "myst-parser>=4.0",
]

[project.scripts]
synplan = "synplan.interfaces.cli:synplan"
release = "scripts.release:main"
sascore-benchmark = "scripts.sascore_bench.run_benchmark:main"
sascore-plot = "scripts.sascore_bench.plot_results:main"
synplan-convert-protection-data = "scripts.convert_protection_source_data:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["synplan", "scripts"]
artifacts = ["*.tsv", "*.csv", "*.yaml", "*.json"]

[tool.uv]
# Floors on transitive dependencies that ship CVE fixes.
constraint-dependencies = [
  "urllib3>=2.7.0",          # GHSA-38jv-5279-wg99, GHSA-gm62-xv2j-4w53, GHSA-qccp-gfcp-xxvc
  "gitpython>=3.1.57",       # argument injection: archive/ls_remote/checkout/diff --output
  "jupyter-server>=2.20.0",  # stored XSS in NbconvertFileHandler (missing sandbox CSP)
  "jupyterlab>=4.5.10",      # XSS via crafted overrides.json
  "pillow>=12.3.0",          # RankFilter heap OOB, McIdas mmap OOB read, bomb-check bypasses
  "tornado>=6.5.5",          # CVE-2026-31958, CVE-2026-35536
  "mistune>=3.3.0",          # quadratic-time parsing (link text, emphasis, ref-link lists)
  "lxml>=6.1.0",             # CVE-2026-41066 (XXE)
  "aiohttp>=3.14.1",         # CVE-2026-22815, CVE-2026-34515, CVE-2026-34516, CVE-2026-34525
  "cryptography>=46.0.7",    # CVE-2026-39892
  "nbconvert>=7.17.1",       # CVE-2026-39377, CVE-2026-39378 (path traversal)
  "bleach>=6.4.0",           # one further bleach advisory has no patched release yet
  "idna>=3.15",
  "pyasn1>=0.6.4",
  "python-multipart>=0.0.31",
  "soupsieve>=2.8.4",        # ReDoS and memory exhaustion in the selector parser
]

# PyTorch backend extras are mutually exclusive
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py310"
[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long — handled by ruff format
    "E722",   # bare except — to be addressed later
    "B905",   # zip() without strict= — too noisy for scientific code
    "SIM108", # ternary operator — sometimes if/else is clearer
    "SIM115", # open-file-with-context-handler — needs refactoring
    "RUF002", # ambiguous unicode in docstrings — non-breaking hyphens
    "RUF003", # ambiguous unicode in comments — non-breaking hyphens
    "F405",   # names from star imports — to be addressed later
    "F403",   # star imports — suppressed globally, per-file for __init__
    "F821",   # undefined names — to be investigated
    "B006",   # mutable argument default — to be addressed later
    "RUF012", # mutable class default without ClassVar — to be addressed later
    "SIM102", # collapsible-if — sometimes nested ifs are clearer
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
# Back-compat shim modules emit a DeprecationWarning at the top (before the
# re-exports) via ``deprecated_module(...)``; that call sits ahead of the
# module-level re-export imports by design, so E402 does not apply here.
"synplan/chem/reaction_rules/*.py" = ["E402"]
"synplan/chem/reaction/routes/route_cgr.py" = ["E402"]

# -- ty type checker ---------------------------------------------------------
# Most chython types are dynamic unions (MoleculeContainer | QueryContainer | ...)
# which cause false positives. Only enforce rules that catch real bugs.
[tool.ty.rules]
# False positives from chython/rdkit/torch/numpy dynamic types
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
not-subscriptable = "ignore"
invalid-method-override = "ignore"
not-iterable = "ignore"
call-non-callable = "ignore"
no-matching-overload = "ignore"
index-out-of-bounds = "ignore"
missing-argument = "ignore"      # chython Reactor has multiple constructors
invalid-type-form = "ignore"     # chython stubs use `any` instead of `Any`
unresolved-import = "ignore"     # rdkit uses dynamic imports (SA_Score, Descriptors)
invalid-return-type = "ignore"   # chython union narrowing false positives
invalid-assignment = "ignore"    # chython union narrowing false positives
invalid-parameter-default = "ignore" # chython defaults
# Keep enabled (catches real bugs like undefined names)
# unresolved-reference = "error"   (default)
[[tool.ty.overrides]]
include = ["synplan/chem/reaction/rules/manual/*.py"]

[tool.ty.overrides.rules]
unknown-argument = "ignore"
